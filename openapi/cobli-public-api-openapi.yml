paths:
  /public/v1/paths:
    get:
      operationId: get_public_v1_paths
      tags:
      - Public
      summary: Detalhes de trajetos e paradas
      description: 'Acompanhe todos os dados de trajetos e paradas da sua frota.

        Com esse endpoint, você pode:

        - Saber cada trajeto e parada que o veículo fez, com os endereços iniciais e finais;

        - Saber o tempo parado em cada parada e o tempo de motor ocioso;

        - Saber a distância percorrida e o tempo de cada trajeto

        - Saber se a parada foi realizada em um local de interesse;

        - Saber o total estimado de combustível gasto;

        - Saber o custo de combustível de cada trajeto e de motor ocioso'
      x-source: https://docs.cobli.co/reference/paths.md
      parameters:
      - name: startDate
        in: query
        required: true
        schema:
          type: string
        description: Data inicial da coleta de dados
      - name: endDate
        in: query
        required: true
        schema:
          type: string
        description: Data limite da coleta de dados
      - name: limit
        in: query
        required: false
        schema:
          type: string
        description: Número de itens presentes na resposta. **O limite máximo de resposta é 2000, qualquer valor acima não será aceito.**
      - name: page
        in: query
        required: false
        schema:
          type: string
        description: Página da resposta, baseada no limite da resposta da requisição
      - name: deviceIds
        in: query
        required: false
        schema:
          type: string
        description: Filtro de busca que retorna somente informações dos dispositivos presentes na lista passada
      - name: groups
        in: query
        required: false
        schema:
          type: string
        description: Filtro de busca que retorna somente informações dos veículos pertencentes aos grupos listados
      - name: licensePlates
        in: query
        required: false
        schema:
          type: string
        description: Filtro de busca que retorna somente informações dos veículos com as placas passadas
      - name: timezone
        in: query
        required: false
        schema:
          type: string
        description: Fuso horário em que a frota opera - (Exemplo `America/Sao_Paulo`)
      responses:
        '200':
          description: Success (status as documented)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPublicV1PathsResponse'
      x-evidence:
        kind: documentation
  /public/v2/events:
    get:
      operationId: get_public_v2_events
      tags:
      - Public
      summary: Use GET /public/v2/events to reconcile deliveries of the last 15 days
      x-source: https://docs.cobli.co/reference/vehicle.md
      responses:
        '200':
          description: Success (status as documented)
      x-evidence:
        kind: documentation
