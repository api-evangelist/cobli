description: Cobli provides a fleet management platform that combines video telematics, traditional telematics, and mobile applications to give
  operators real‑time visibility, reduce costs, improve driver safety, and optimize routes. The solution includes video‑based driver monitoring,
  AI‑driven analytics, fuel and maintenance tracking, and compliance tools, serving logistics companies and vehicle fleets across Brazil and Latin
  America.

